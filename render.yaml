# One free service. Supply MongoDB separately through Atlas Free.
services:
  - type: web
    name: smartwall-internship
    runtime: node
    plan: free
    region: singapore
    rootDir: smart-wall
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_DATABASE
        value: smartwall
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_EMAIL_FEATURES
        value: "false"
      - key: LOCAL_BACKUPS_ENABLED
        value: "false"
      - key: PASSWORD_HASH_CONCURRENCY
        value: "1"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
